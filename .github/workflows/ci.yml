name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - id: exists
        working-directory: .
        run: echo "found=$([ -f backend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - if: steps.exists.outputs.found == 'true'
        run: npm ci
      - if: steps.exists.outputs.found == 'true'
        run: npx prisma validate && npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - if: steps.exists.outputs.found == 'true'
        run: npm run lint
      - if: steps.exists.outputs.found == 'true'
        run: npm run build
      - if: steps.exists.outputs.found == 'true'
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: exists
        working-directory: .
        run: echo "found=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.exists.outputs.found == 'true'
        run: npm ci
      - if: steps.exists.outputs.found == 'true'
        run: npm run lint
      - if: steps.exists.outputs.found == 'true'
        run: npm run typecheck
      - if: steps.exists.outputs.found == 'true'
        run: npm run build
